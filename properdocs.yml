site_name: Trivasa BI — Context
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
markdown_extensions:
  # El custom_fence de mermaid es lo que hace que los ```mermaid se rendericen
  # como diagrama y no como bloque de codigo. mkdocs-material trae mermaid.js
  # incluido, pero solo lo activa si el fence emite class="mermaid".
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - pymdownx.details
  - tables
  - attr_list
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_code_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
